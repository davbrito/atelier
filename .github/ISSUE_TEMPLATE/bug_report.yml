name: Bug report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so it can be reproduced and fixed quickly.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reliably reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: If applicable, add screenshots or error logs to help explain the problem.

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser/OS, and whether this happened in production or locally.
      placeholder: e.g. Chrome 128 on macOS, production

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might be relevant (e.g. it only happens for a specific organization, only after a recent deploy, etc.)
