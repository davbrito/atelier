name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe the problem and the proposed solution so it's easy to evaluate.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What's the current limitation or pain point? Who runs into it?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? Be as specific as you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about, and why you didn't go with them.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mockups, related issues, or anything else that adds context.
